name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  banco:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      PGPASSWORD: postgres
      PGHOST: 127.0.0.1
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instala pgTAP (extensão que os testes usam)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16-pgtap libtap-parser-sourcehandler-pgtap-perl

      - name: Instala dependências (raiz — scripts/migrate.js)
        run: npm install

      - name: Aplica as migrations
        run: npm run db:migrate

      - name: pgTAP — regras críticas (permissões, ledger, venda, caixa, entrada, fuso)
        run: bash scripts/test-db.sh

      - name: Instala dependências do teste de concorrência
        working-directory: tests/concorrencia
        run: npm install

      - name: Concorrência — duas vendedoras, última peça
        working-directory: tests/concorrencia
        run: npm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instala dependências
        run: npm install --if-present
      - name: Build
        run: npm run build --if-present

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instala dependências
        run: npm install --if-present
      - name: Testes
        run: npm test --if-present
