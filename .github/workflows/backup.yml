name: Backup semanal

on:
  schedule:
    - cron: '0 6 * * 1' # toda segunda, 06:00 UTC (03:00 America/Fortaleza)
  workflow_dispatch: {}

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: pg_dump do Postgres do Railway
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bash scripts/backup.sh
      - name: Sobe o dump como artifact
        uses: actions/upload-artifact@v4
        with:
          name: kiarys-backup-${{ github.run_id }}
          path: backup-*.sql.gz
          retention-days: 90
