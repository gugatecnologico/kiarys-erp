project_id = "kiarys-erp"

[api]
enabled = true
port = 54321
# `kiarys` precisa estar exposto para as RPCs resolverem via PostgREST —
# ver nota em 0001_base.sql / 0014_permissoes.sql. Em produção, isso é
# espelhado manualmente em Settings > API > Exposed schemas (não existe
# `supabase db push` para config de API, só para schema).
schemas = ["public", "kiarys"]
extra_search_path = ["public", "kiarys"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = false
# Cadastro de vendedora é sempre pelo admin (painel Supabase ou, no
# futuro, uma Edge Function) — nunca autocadastro público (README,
# seção "Como criar o primeiro admin").

[auth.email]
enable_signup = false
enable_confirmations = false
